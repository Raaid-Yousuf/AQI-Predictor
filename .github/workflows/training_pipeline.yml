name: Training Pipeline (daily)

on:
  schedule:
    - cron: "30 2 * * *"   # once a day at 02:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit updated model files back to the repo

jobs:
  train-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-training.txt

      - name: Run training pipeline
        env:
          CITY_NAME: ${{ vars.CITY_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python -m training_pipeline.train

      - name: Commit updated model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/*.pkl models/*.keras 2>/dev/null || git add models/*.pkl
          git diff --staged --quiet || git commit -m "Auto-retrain models [skip ci]"
          git push